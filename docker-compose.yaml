version: '3.8'

services:
  # coturn handles WebRTC audio stream routing (UDP is required)
  coturn:
    image: coturn/coturn:4.8.0
    container_name: dograh-coturn
    restart: unless-stopped
    command:
      - -n
      - "--listening-port=3478"
      - "--tls-listening-port=5349"
      - "--min-port=49152"
      - "--max-port=49200"
      - "--external-ip=${SERVER_PUBLIC_IP}"
      - "--realm=dograh.msrnayeem.cloud"
      - --use-auth-secret
      - "--static-auth-secret=${TURN_SECRET}"
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - "--log-file=stdout"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    networks:
      - dograh-network

  api:
    image: dograhai/dograh-api:latest
    container_name: dograh-api
    restart: unless-stopped
    volumes:
      - shared-tmp:/tmp
      - ./api:/app/api
      - ./pipecat/src/pipecat:/opt/venv/lib/python3.13/site-packages/pipecat
    environment:
      ENVIRONMENT: "production"
      LOG_LEVEL: "INFO"
      
      # Single domain setup (Nginx proxies /api/v1 to port 8000)
      BACKEND_API_ENDPOINT: "https://dograh.msrnayeem.cloud"
      
      # Reuse your existing Postgres
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST_IP}:5433/dograh"
      
      # Reuse your existing Redis
      REDIS_URL: "redis://:${REDIS_PASSWORD}@${REDIS_HOST_IP}:6379/1" # Database index 1 to isolate it
      
      # Reuse your existing MinIO (s3.khadin.com)
      ENABLE_AWS_S3: "false"
      MINIO_ENDPOINT: "${MINIO_HOST_IP}:9000"
      MINIO_PUBLIC_ENDPOINT: "https://s3.khadin.com"
      MINIO_ACCESS_KEY: "${MINIO_USER}"
      MINIO_SECRET_KEY: "${MINIO_PASSWORD}"
      MINIO_BUCKET: "dograh-voice-audio"
      MINIO_SECURE: "true"
      
      FASTAPI_WORKERS: "1"
      FORWARDED_ALLOW_IPS: "*"
      
      TURN_HOST: "${SERVER_PUBLIC_IP}"
      TURN_SECRET: "${TURN_SECRET}"
      OSS_JWT_SECRET: "${OSS_JWT_SECRET}"
    ports:
      - "127.0.0.1:8000:8000" # Bind to localhost only (Nginx reverse-proxies this)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/api/v1/health'').read()"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - dograh-network

  ui:
    image: dograhai/dograh-ui:latest
    container_name: dograh-ui
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: "http://dograh-api:8000" # Internal docker routing
      NODE_ENV: "oss"
    ports:
      - "127.0.0.1:3010:3010" # Bind to localhost only (Nginx reverse-proxies this)
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dograh-network

networks:
  dograh-network:
    driver: bridge

volumes:
  shared-tmp:
